version: '3.8'

services:
  postgres:
    image: postgis/postgis:latest
    container_name: event_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password@3224
      POSTGRES_DB: event_ticketing_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: